name: Draw the contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["snake/**", ".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Play Snake on the contribution graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 snake/generate.py --user "${{ github.repository_owner }}" --output dist/snake.svg --theme indigo --frame

      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
